<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 التقاط صور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 20px; }
    .video-wrap { position: relative; width: 100%; max-width: 420px; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 3/4; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 120px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.2s; }
    .countdown.show { opacity: 1; }
    .buttons { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button { padding: 14px 28px; font-size: 17px; font-weight: 600; border-radius: 12px; border: none; cursor: pointer; }
    #startBtn { background: #2ea6ff; color: #fff; }
    #switchBtn { background: #444; color: #fff; display: none; }
    #status { margin-top: 20px; font-size: 15px; min-height: 24px; text-align: center; max-width: 420px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>📸 التقاط 3 صور</h1>
  <div class="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="countdown" class="countdown"></div>
  </div>
  <div class="buttons">
    <button id="startBtn">🎥 تشغيل الكاميرا</button>
    <button id="switchBtn">🔄 تبديل الكاميرا</button>
  </div>
  <div id="status"></div>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const switchBtn = document.getElementById('switchBtn');
    const countdownEl = document.getElementById('countdown');
    let stream = null;
    let currentFacing = 'user';

    async function checkCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        if (cams.length > 1) switchBtn.style.display = 'inline-block';
      } catch (e) {}
    }
    checkCameras();

    async function startCamera(facing = currentFacing) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 720 }, height: { ideal: 960 } }
      });
      video.srcObject = stream;
      currentFacing = facing;
    }

    switchBtn.onclick = async () => {
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      await startCamera(currentFacing);
      setStatus(currentFacing === 'user' ? '📷 الكاميرا الأمامية' : '📷 الكاميرا الخلفية');
    };

    function setStatus(msg, cls = '') { status.textContent = msg; status.className = cls; }
    function showCountdown(n) { countdownEl.textContent = n; countdownEl.classList.add('show'); setTimeout(() => countdownEl.classList.remove('show'), 700); }

    startBtn.onclick = async () => {
      try {
        startBtn.disabled = true;
        await startCamera(currentFacing);
        await new Promise(r => setTimeout(r, 500));

        const photos = [];
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 720;
        canvas.height = video.videoHeight || 960;

        for (let i = 0; i < 3; i++) {
          for (let c = 3; c > 0; c--) { showCountdown(c); await new Promise(r => setTimeout(r, 700)); }
          canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
          photos.push(blob);
          setStatus(`✅ تم التقاط ${i + 1} من 3`);
        }

        stream.getTracks().forEach(t => t.stop());
        setStatus('📤 جارٍ الإرسال إلى تيليجرام...');
        const form = new FormData();
        photos.forEach((p, i) => form.append('photos', p, `photo_${i + 1}.jpg`));

        const res = await fetch('/upload', { method: 'POST', body: form });
        const data = await res.json();

        if (data.ok) setStatus('🎉 تم إرسال الصور بنجاح!', 'success');
        else setStatus('❌ فشل الإرسال', 'error');
      } catch (err) {
        setStatus('❌ خطأ: ' + err.message, 'error');
      } finally { startBtn.disabled = false; }
    };
  </script>
</body>
</html>
